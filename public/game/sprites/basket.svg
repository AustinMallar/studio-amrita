<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 32">
  <!-- Crochet basket matching reference photo - peach/tan square basket -->
  <!-- Basket body -->
  <rect x="2" y="10" width="40" height="20" rx="3" fill="#d4a882"/>
  <!-- Crochet stitch rows -->
  <path d="M2 15 Q22 13 42 15" stroke="#b8845e" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M2 20 Q22 18 42 20" stroke="#b8845e" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M2 25 Q22 23 42 25" stroke="#b8845e" stroke-width="1" fill="none" opacity="0.55"/>
  <!-- Vertical stitch lines -->
  <line x1="9" y1="10" x2="9" y2="30" stroke="#b8845e" stroke-width="0.8" opacity="0.45"/>
  <line x1="16" y1="10" x2="16" y2="30" stroke="#b8845e" stroke-width="0.8" opacity="0.45"/>
  <line x1="22" y1="10" x2="22" y2="30" stroke="#b8845e" stroke-width="0.8" opacity="0.45"/>
  <line x1="28" y1="10" x2="28" y2="30" stroke="#b8845e" stroke-width="0.8" opacity="0.45"/>
  <line x1="35" y1="10" x2="35" y2="30" stroke="#b8845e" stroke-width="0.8" opacity="0.45"/>
  <!-- Top rim -->
  <rect x="0" y="8" width="44" height="6" rx="3" fill="#e0b896"/>
  <path d="M3 11 Q22 9 41 11" stroke="#c89872" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Rim fold at top -->
  <rect x="1" y="6" width="42" height="4" rx="2" fill="#c89872"/>
  <!-- Side shading -->
  <rect x="30" y="10" width="12" height="20" rx="2" fill="#b8845e" opacity="0.18"/>
  <!-- Highlight -->
  <rect x="3" y="11" width="14" height="8" rx="2" fill="white" opacity="0.2"/>
</svg>
