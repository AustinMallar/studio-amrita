<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36">
  <!-- Yarn bomb - dark ball with fuse -->
  <!-- Shadow -->
  <ellipse cx="16" cy="33" rx="9" ry="3" fill="rgba(0,0,0,0.2)"/>
  <!-- Outer ring (yarn wraps) -->
  <circle cx="16" cy="20" r="12" fill="#2a2030"/>
  <!-- Yarn texture ridges -->
  <path d="M5 16 Q16 13 27 16" stroke="#3e3050" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M4 21 Q16 18 28 21" stroke="#3e3050" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M5 26 Q16 23 27 26" stroke="#3e3050" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Highlight -->
  <ellipse cx="11" cy="15" rx="4" ry="3" fill="white" opacity="0.15"/>
  <!-- Fuse cord -->
  <path d="M16 8 Q20 4 19 1" stroke="#c87040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Spark -->
  <circle cx="19" cy="1" r="3.5" fill="#ffd040"/>
  <circle cx="19" cy="1" r="2" fill="white"/>
  <!-- Spark rays -->
  <line x1="19" y1="-2" x2="19" y2="-5" stroke="#ffd040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="-1" x2="24" y2="-3" stroke="#ffd040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="-1" x2="14" y2="-3" stroke="#ffd040" stroke-width="1.5" stroke-linecap="round"/>
</svg>
